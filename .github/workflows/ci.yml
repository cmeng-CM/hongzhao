# CI 冒烟工作流（push/PR 触发：安装+版本+测试；实跑绿=AC-P0-2 补验，2026-11-02）
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    # W4（Windows 支持）：三 OS 矩阵——Windows 必含 3.9（junction 识别低版本路径）与最新；mac 保底一档
    strategy:
      fail-fast: false  # 单档失败不连坐，保留全量信号
      matrix:
        include:
          # 3.9（2025-10 EOL）无 26.04/新镜像构建：钉在有构建的镜像上（W4 下限=3.9 与最新都覆盖）
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-2022, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Print version
        run: hongzhao --version
      - name: Run tests
        run: pytest --junitxml=report.xml
      - name: Publish failure summary
        if: failure()   # 公开仓日志下载需鉴权；摘要进 run summary 匿名可读，排障不再盲猜
        shell: bash
        run: python scripts/ci_failure_summary.py report.xml >> "$GITHUB_STEP_SUMMARY"

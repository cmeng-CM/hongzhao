# 发布工作流（T-21）：tag（v*）触发；构建 sdist+wheel → 冒烟 → OIDC Trusted Publishing 上传 PyPI。
# 隐私门（check-clean 每工件，scripts/check_clean.py）在作者侧本地执行——词表永不入库——
# 通过后才打本工作流对应的 tag；PyPI 侧由 pending publisher（cmeng-CM/hongzhao · release.yml ·
# environment=release）约束 OIDC 来源。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read  # 私库 checkout 所需；publish 任务单独叠加 id-token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke test (install from wheel)
        run: |
          ls -l dist/
          python -m pip install dist/*.whl
          hongzhao --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write  # OIDC：PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

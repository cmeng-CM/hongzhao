<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="'PingFang SC','Noto Sans CJK SC','Hiragino Sans GB',Helvetica,Arial,sans-serif">
  <rect width="1600" height="560" fill="#fafafa"/>
  <text x="800" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#1a1a1a">工作循环：归置、取用、处理</text>
  <text x="800" y="86" text-anchor="middle" font-size="17" fill="#555">done 不是“在对话里解释过”——而是信息放在正确的位置，下次找得到。</text>

  <!-- three stages in a cycle -->
  <g>
    <rect x="120" y="150" width="400" height="230" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
    <rect x="120" y="150" width="400" height="54" rx="14" fill="#e8590c"/>
    <text x="320" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="white">1 · 归置</text>
    <g font-size="14" fill="#444">
      <text x="320" y="245" text-anchor="middle">agent 起草一条 raw 事实主张（候选）</text>
      <text x="320" y="275" text-anchor="middle">你审阅摘要与关系</text>
      <text x="320" y="305" text-anchor="middle">项目契约每个项目只登记一次</text>
    </g>
    <text x="320" y="355" text-anchor="middle" font-size="13" fill="#888">涉及文件：raw/ · registry/ · projects/</text>
  </g>
  <g>
    <rect x="600" y="150" width="400" height="230" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5"/>
    <rect x="600" y="150" width="400" height="54" rx="14" fill="#2f9e44"/>
    <text x="800" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="white">2 · 编译</text>
    <g font-size="14" fill="#444">
      <text x="800" y="245" text-anchor="middle">确定性门：先校验再编译</text>
      <text x="800" y="275" text-anchor="middle">重算有效性与视图</text>
      <text x="800" y="305" text-anchor="middle">doctor 报告客户端与产物健康度</text>
    </g>
    <text x="800" y="355" text-anchor="middle" font-size="13" fill="#888">命令：hongzhao compile · doctor</text>
  </g>
  <g>
    <rect x="1080" y="150" width="400" height="230" rx="14" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2.5"/>
    <rect x="1080" y="150" width="400" height="54" rx="14" fill="#1c7ed6"/>
    <text x="1280" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="white">3 · 取用</text>
    <g font-size="14" fill="#444">
      <text x="1280" y="245" text-anchor="middle">下个会话从启动摘要开始</text>
      <text x="1280" y="275" text-anchor="middle">按索引路由，落到项目视图</text>
      <text x="1280" y="305" text-anchor="middle">仅核对事实主张时才打开 raw/</text>
    </g>
    <text x="1280" y="355" text-anchor="middle" font-size="13" fill="#888">读取：compiled/ · render/（默认不读 raw/）</text>
  </g>

  <!-- cycle arrows -->
  <defs><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#666"/></marker></defs>
  <line x1="520" y1="265" x2="595" y2="265" stroke="#666" stroke-width="3" marker-end="url(#e)"/>
  <line x1="1000" y1="265" x2="1075" y2="265" stroke="#666" stroke-width="3" marker-end="url(#e)"/>
  <path d="M1280 380 C 1280 480, 320 480, 320 385" fill="none" stroke="#666" stroke-width="3" marker-end="url(#e)"/>
  <text x="800" y="470" text-anchor="middle" font-size="14" fill="#555">每个循环：候选始终过门，视图始终可重建，事实始终属于你</text>

  <text x="800" y="525" text-anchor="middle" font-size="14" fill="#888">全程纯文本文件：可 grep、可 diff、可用 git 备份。</text>
</svg>

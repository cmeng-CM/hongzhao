<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory claim lifecycle and conflict handling</title>
  <desc id="desc">A new candidate becomes done or rejected after review; conflicts are never auto-resolved in favor of the newest record, confirmed conflicts enter degraded, and the adopted claim is restored only after an explicit resolution.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrowGray" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#64748b"/></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#059669"/></marker>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#dc2626"/></marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#ea580c"/></marker>
    <style>.bg{fill:#f8fafc}.title{font:700 42px 'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#0f172a}.subtitle{font:400 22px 'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#475569}.h{font:700 26px 'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#0f172a}.t{font:400 18px 'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#475569}.label{font:700 17px 'PingFang SC','Noto Sans CJK SC',sans-serif}.white{fill:white}.mono{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect class="bg" width="1600" height="1100" rx="24"/>
  <text class="title" x="800" y="70" text-anchor="middle">Facts over time: claim lifecycle and conflict resolution</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">“Updated” is not “correct”; any hiding, invalidation, or coverage requires an explicit relation</text>

  <g filter="url(#shadow)"><rect x="80" y="185" width="275" height="155" rx="26" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="125" cy="230" r="22" fill="#ea580c"/><text x="125" y="238" text-anchor="middle" font-size="21" fill="white">W</text><text class="h" x="165" y="240">new</text><text class="t" x="115" y="282">user asked to keep long-term</text><text class="t" x="115" y="315">not yet in the effective view</text></g>
  <path d="M355 262 L420 262" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>
  <g filter="url(#shadow)"><path d="M570 155 L720 262 L570 369 L420 262 Z" fill="white" stroke="#94a3b8" stroke-width="2"/><text class="h" x="570" y="250" text-anchor="middle">Semantic review</text><text class="t" x="570" y="282" text-anchor="middle">duplicate / complement / conflict</text></g>

  <path d="M720 262 L865 262" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/><text class="label" x="785" y="240" text-anchor="middle" fill="#047857">Confirmed valid</text>
  <g filter="url(#shadow)"><rect x="865" y="185" width="275" height="155" rx="26" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><circle cx="910" cy="230" r="22" fill="#059669"/><text x="910" y="238" text-anchor="middle" font-size="21" fill="white">✓</text><text class="h" x="950" y="240">done</text><text class="t" x="900" y="282">no supersede/cover/conflict</text><text class="t" x="900" y="315">only then the adopted claim</text></g>
  <path d="M535 350 C500 420 300 420 217 485" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/><text class="label" x="405" y="420" text-anchor="middle" fill="#475569">Does not hold</text>
  <g filter="url(#shadow)"><rect x="80" y="485" width="275" height="135" rx="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text class="h" x="217" y="535" text-anchor="middle">rejected</text><text class="t" x="217" y="575" text-anchor="middle">kept for audit, not in any view</text></g>

  <path d="M1140 262 L1210 262" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/><text class="label" x="1185" y="240" text-anchor="middle" fill="#b91c1c">Conflict</text>
  <g filter="url(#shadow)"><path d="M1365 150 L1520 262 L1365 374 L1210 262 Z" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text class="h" x="1365" y="238" text-anchor="middle">Conflict types</text><text class="t" x="1365" y="272" text-anchor="middle">new ↔ done</text><text class="t" x="1365" y="304" text-anchor="middle">done ↔ done</text></g>

  <path d="M1320 350 C1260 425 1160 440 1080 485" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <g filter="url(#shadow)"><rect x="810" y="485" width="355" height="155" rx="26" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text class="h" x="987" y="530" text-anchor="middle">new ↔ done</text><text class="t" x="987" y="570" text-anchor="middle">old done stays effective</text><text class="t" x="987" y="602" text-anchor="middle">new stays pending, no relation written</text></g>
  <path d="M1415 355 C1460 420 1450 455 1372 485" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <g filter="url(#shadow)"><rect x="1215" y="485" width="315" height="155" rx="26" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text class="h" x="1372" y="530" text-anchor="middle">done ↔ done</text><text class="t" x="1372" y="570" text-anchor="middle">must be confirmed with the user</text><text class="t" x="1372" y="602" text-anchor="middle">not yet resolved: locally excluded</text></g>

  <path d="M1372 640 L1372 705" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
  <g filter="url(#shadow)"><rect x="1195" y="705" width="355" height="105" rx="24" fill="#7f1d1d"/><text class="h white" x="1372" y="748" text-anchor="middle">degraded</text><text x="1372" y="780" text-anchor="middle" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="18" fill="#fecaca">conflict visible; wrong context stopped</text></g>

  <g filter="url(#shadow)"><rect x="430" y="690" width="660" height="140" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text class="h" x="760" y="735" text-anchor="middle">Explicit resolution restores the effective view</text><rect x="470" y="765" width="175" height="38" rx="19" fill="#dbeafe"/><text class="mono" x="557" y="790" text-anchor="middle" fill="#1d4ed8">supersedes</text><rect x="670" y="765" width="120" height="38" rx="19" fill="#ede9fe"/><text class="mono" x="730" y="790" text-anchor="middle" fill="#6d28d9">covers</text><rect x="815" y="765" width="235" height="38" rx="19" fill="#d1fae5"/><text class="mono" x="932" y="790" text-anchor="middle" fill="#047857">resolved_by / synthesis</text></g>
  <path d="M1195 757 C1145 757 1130 757 1090 757" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <path d="M760 690 C700 590 720 410 865 320" stroke="#059669" stroke-width="3" stroke-dasharray="9 8" fill="none" marker-end="url(#arrowGreen)"/><text class="label" x="610" y="590" fill="#047857">forms the new adopted claim</text>
  <g id="glossary">
    <rect x="55" y="885" width="1490" height="190" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="80" y="918" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#0f172a">Glossary</text>
    <text x="80.0" y="950" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">claim</tspan><tspan font-size="13">: one statement of fact that can be reviewed, confirmed, rejected, covered, or superseded</tspan></text>
    <text x="837.0" y="950" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">adopted claim</tspan><tspan font-size="13">: the canonical claim; the claim currently entering Effective Memory</tspan></text>
    <text x="80.0" y="979" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">derived_from</tspan><tspan font-size="13">: marks evidence provenance; never hides the source claim</tspan></text>
    <text x="837.0" y="979" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">covers</tspan><tspan font-size="13">: synthesis fully takes over the source's valid content; source no longer shown separately</tspan></text>
    <text x="80.0" y="1008" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">supersedes</tspan><tspan font-size="13">: the new claim explicitly invalidates the old claim</tspan></text>
    <text x="837.0" y="1008" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">conflicts_with</tspan><tspan font-size="13">: a confirmed but not-yet-resolved factual conflict</tspan></text>
    <text x="80.0" y="1037" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">resolved_by</tspan><tspan font-size="13">: points to the claim that resolves the conflict</tspan></text>
    <text x="837.0" y="1037" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">synthesis</tspan><tspan font-size="13">: a new raw claim distilled from one or more sources</tspan></text>
    <text x="80.0" y="1066" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">pending / new</tspan><tspan font-size="13">: candidates awaiting review, not in the current effective view</tspan></text>
    <text x="837.0" y="1066" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#475569"><tspan font-size="14" font-weight="700" fill="#1d4ed8">degraded</tspan><tspan font-size="13">: conflicts or structural errors safely exclude some context</tspan></text>
  </g>
</svg>
